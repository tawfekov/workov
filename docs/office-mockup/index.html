  #log time { color:#8b8576; margin-right:6px; font-variant-numeric:tabular-nums; }
  .lbl { position:fixed; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; text-align:center; white-space:nowrap; will-change:transform; }
  .lbl .name { display:inline-block; background:#fff; border:1px solid #c9c2b0; border-radius:999px; padding:1px 9px; font-weight:700; font-size:11px; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .lbl .name small { font-weight:500; color:#7a7466; margin-left:5px; }
  .lbl .say { display:block; margin:3px auto 0; max-width:210px; overflow:hidden; text-overflow:ellipsis; background:#1f2a37; color:#e8eef7; border-radius:8px; padding:2px 8px; font-size:10.5px; font-family:Consolas,monospace; }
  .lbl .say.you { background:#b3261e; color:#fff; font-family:inherit; font-weight:600; }
  .lbl .say.zzz { background:#e9e4d6; color:#7a7466; font-family:inherit; }
  .zone { position:fixed; left:0; top:0; transform:translate(-50%,-50%); pointer-events:none; font-weight:800; letter-spacing:.14em; font-size:11px; color:rgba(40,34,20,.55); text-transform:uppercase; }
  .night #hud, .night #log { background:rgba(30,32,40,.92); color:#e8e6df; border-color:#3a3f4c; } .night #log div { color:#bdb8aa; } .night #log div:first-child { color:#fff; }
  .night .zone { color:rgba(255,255,255,.55); }
  .note { position:fixed; right:14px; bottom:14px; font-size:11px; color:#5d584c; background:rgba(250,248,243,.85); border-radius:8px; padding:5px 9px; }
</style>

<script type="module">
import * as THREE from 'three';

const MODELS = {};
await Promise.all(['desk','chairDesk','computerScreen','computerKeyboard','computerMouse','pottedPlant','plantSmall1','lampRoundTable','bookcaseClosed','bookcaseOpen','rugRectangle','rugRound','loungeSofa','loungeChair','tableCoffee','speaker','cabinetTelevision'].map(n => new Promise(res => new GLTFLoader().load('./models/' + n + '.glb', g => { MODELS[n] = g.scene; res(); }, undefined, () => res()))));

const PATH = [[8.5, -2.0, 'pick EJA-012 from Todo'], [2, -2.0, 'checking the mockup'], [-5, -2.0, 'dispatch 012 to worker 3'], [-3, 0.4, 'worker 3, new ticket'], [4, 0.4, 'nothing in Review'], [9, 0.4, 'outbox is empty'], [8.5, -2.0, 'back to Todo']];

// ---------- camera control (drag, wheel) ----------
const target = new THREE.Vector3(0, 0, 0);
const cam = { az: 0.32, pol: 0.98, r: 44 }, camHome = { az: 0.32, pol: 0.98, r: 44 };
window.__cam = cam; window.__M = MODELS; window.__T = THREE;
let drag = null, spin = false;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; cam.az -= (e.clientX - drag.x) * 0.005; cam.pol = Math.min(1.45, Math.max(0.35, cam.pol - (e.clientY - drag.y) * 0.004)); drag = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); cam.r = Math.min(70, Math.max(14, cam.r * (1 + e.deltaY * 0.001))); }, { passive: false });
document.getElementById('spin').onclick = () => spin = !spin;
document.getElementById('reset').onclick = () => Object.assign(cam, camHome);
let night = false;

// ---------- loop ----------
const v = new THREE.Vector3();
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
function place(el, pos) { v.copy(pos).project(camera); const ok = v.z < 1; el.style.display = ok ? '' : 'none'; el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px'; el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px'; }
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (spin) cam.az += dt * 0.25;
  camera.position.set(target.x + cam.r * Math.sin(cam.pol) * Math.sin(cam.az), target.y + cam.r * Math.cos(cam.pol), target.z + cam.r * Math.sin(cam.pol) * Math.cos(cam.az));
  camera.lookAt(target);
  for (const s of screens) s.material.color.setHSL(0.58, 0.8, 0.55 + Math.sin(t * 3 + s.id) * 0.05);
  for (const a of agents) {
    const u = a.p.userData, arms = u.arms, head = u.head;
    if (u.glb) {
      u.mixer.update(dt);
      if (u.mode === 'walk') {
        const tgt = PATH[rt.i], dx = tgt[0] - a.p.position.x, dz = tgt[1] - a.p.position.z, dist = Math.hypot(dx, dz);
        if (dist > 0.08) { const sp = 2.8 * dt; a.p.position.x += dx / dist * Math.min(sp, dist); a.p.position.z += dz / dist * Math.min(sp, dist); a.p.rotation.y = Math.atan2(dx, dz); playClip(u, carry.visible ? 'holding-both' : 'walk'); a.say.textContent = tgt[2]; }
        else { playClip(u, carry.visible ? 'holding-both' : 'idle'); rt.wait -= dt; if (rt.wait <= 0) { rt.i = (rt.i + 1) % PATH.length; rt.wait = 1.6; if (rt.i === 0) carry.visible = true; if (rt.i === 3) carry.visible = false; } }
      } else {
        playClip(u, a.clip);
        if (u.mode === 'sleep') { u.model.rotation.x = 0.28 + Math.sin(t * 1.2) * 0.03; a.say.classList.add('zzz'); }
        if (a.msgs.length && t > a.next) { a.say.textContent = a.msgs[a.mi++ % a.msgs.length]; a.next = t + 2.2 + Math.random() * 2.5; }
      }
      place(a.lbl, v.set(a.p.position.x, a.top, a.p.position.z));
      continue;
    }
    if (u.mode === 'typing') { arms[0].rotation.x = -1.25 + Math.sin(t * 14 + u.phase) * 0.12; arms[1].rotation.x = -1.25 + Math.sin(t * 13 + u.phase + 1.7) * 0.12; head.rotation.x = Math.sin(t * 1.6 + u.phase) * 0.07; }
    else if (u.mode === 'idle') { arms.forEach(x => x.rotation.x = -0.5); head.rotation.y = Math.sin(t * 0.5 + u.phase) * 0.5; u.body.position.y = Math.sin(t * 1.4 + u.phase) * 0.012; }
    else if (u.mode === 'sleep') { arms.forEach(x => x.rotation.x = -0.9); head.rotation.x = 0.55 + Math.sin(t * 1.2) * 0.04; head.position.y = 1.78; }
    else if (u.mode === 'hand') { arms[1].rotation.z = -2.7 + Math.sin(t * 6) * 0.25; arms[1].rotation.x = 0; arms[0].rotation.x = -1.2; head.rotation.y = Math.sin(t * 1.5) * 0.3; }
    if (u.mode === 'walk') {
      const tgt = PATH[rt.i], dx = tgt[0] - a.p.position.x, dz = tgt[1] - a.p.position.z, dist = Math.hypot(dx, dz);
      if (dist > 0.08) { const sp = 2.6 * dt; a.p.position.x += dx / dist * Math.min(sp, dist); a.p.position.z += dz / dist * Math.min(sp, dist); a.p.rotation.y = Math.atan2(dx, dz); const sw = Math.sin(t * 9) * 0.6; u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; arms[0].rotation.x = -sw * 0.8; arms[1].rotation.x = sw * 0.8; a.p.position.y = Math.abs(Math.sin(t * 9)) * 0.05; a.say.textContent = tgt[2]; }
      else { u.legs.forEach(l => l.rotation.x = 0); arms.forEach(x => x.rotation.x = carry.visible ? -1.1 : -0.2); rt.wait -= dt; if (rt.wait <= 0) { rt.i = (rt.i + 1) % PATH.length; rt.wait = 1.6; if (rt.i === 0) carry.visible = true; if (rt.i === 3) carry.visible = false; } }
    }
    if (u.mode === 'idle' && u.standing) { u.legs.forEach(l => l.rotation.x = 0); }
    // bubble text
    if (a.msgs.length && u.mode !== 'walk' && t > a.next) { a.say.textContent = a.msgs[a.mi++ % a.msgs.length]; a.next = t + 2.2 + Math.random() * 2.5; }
    if (u.mode === 'sleep') { a.say.classList.add('zzz'); }
    place(a.lbl, v.set(a.p.position.x, a.top, a.p.position.z));
  }
  for (const z of zoneLabels) place(z.el, z.pos);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
